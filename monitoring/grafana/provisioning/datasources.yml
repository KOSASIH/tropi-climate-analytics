# ============================================================
# Grafana Dashboard Provisioning — Tropi Climate Analytics
# ============================================================
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

dashboardProviders:
  - name: tropi-dashboards
    orgId: 1
    folder: "Tropi Climate Analytics"
    type: file
    options:
      path: /var/lib/grafana/dashboards
