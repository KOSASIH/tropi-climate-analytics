# ============================================================
# Logstash Pipeline — Tropi Climate Analytics
# Ingest: Kubernetes pod logs + API access logs + ETL events
# Output: Elasticsearch
# ============================================================

input {
  # Kubernetes log shipper (Filebeat -> Logstash)
  beats {
    port => 5044
    ssl  => true
    ssl_certificate => "/etc/logstash/certs/logstash.crt"
    ssl_key         => "/etc/logstash/certs/logstash.key"
  }

  # Direct Kafka topic for structured app events
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_BROKERS}"
    topics            => ["app-logs", "etl-events", "api-access"]
    group_id          => "logstash-consumers"
    codec             => json
    security_protocol => "SSL"
    ssl_truststore_location => "/etc/logstash/kafka.truststore.jks"
    ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
  }
}

filter {
  # Parse JSON log lines
  if [message] =~ /^\{/ {
    json { source => "message" }
  }

  # Enrich with GeoIP for API access logs
  if [log_type] == "api_access" {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Normalize log levels
  mutate {
    lowercase => ["log.level"]
    add_field => {
      "[@metadata][index_prefix]" => "tropi-climate"
      "environment"              => "production"
      "cluster"                  => "ap-southeast-3"
    }
  }

  # Parse timestamps
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Drop health-check noise
  if [request] =~ /\/health/ {
    drop {}
  }
}

output {
  elasticsearch {
    hosts    => ["https://${ES_HOST}:9200"]
    user     => "${ES_USER}"
    password => "${ES_PASSWORD}"
    ssl      => true
    cacert   => "/etc/logstash/certs/ca.crt"
    index    => "%{[@metadata][index_prefix]}-%{[log_type]:app}-%{+YYYY.MM.dd}"
    ilm_enabled      => true
    ilm_rollover_alias => "tropi-climate"
    ilm_policy       => "tropi-logs-policy"
  }

  # Dead-letter queue for failed events
  if "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] {
    s3 {
      bucket         => "${S3_LOGS_BUCKET}"
      prefix         => "logstash-dlq/%{+YYYY/MM/dd}/"
      region         => "ap-southeast-3"
      codec          => json_lines
    }
  }
}
