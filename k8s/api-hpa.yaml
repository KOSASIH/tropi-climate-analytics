# ============================================================
# API HPA — min 2, max 10 pods
# Scales on CPU (70%), memory (80%), and custom RPS metric
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tropi-api-hpa
  namespace: tropi-climate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tropi-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric: scale on requests-per-second via Prometheus Adapter
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # 5-min cooldown before scale-in
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
