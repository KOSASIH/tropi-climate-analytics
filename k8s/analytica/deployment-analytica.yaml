apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytica-model-server
  namespace: analytica
  labels:
    app: analytica-model-server
    component: ml-serving
    team: analytica
    sprint: "4"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: analytica-model-server
  template:
    metadata:
      labels:
        app: analytica-model-server
        component: ml-serving
    spec:
      containers:
        - name: analytica-model-server
          image: ghcr.io/kosasih/analytica-model-server:latest
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: analytica-config
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
