apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytica-model-server
  namespace: analytica
  labels:
    app: analytica-model-server
    version: "1.0"
    managed-by: climate-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytica-model-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: analytica-model-server
        version: "1.0"
    spec:
      containers:
        - name: analytica-model-server
          image: ghcr.io/kosasih/analytica-model-server:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: analytica-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
