# Application: hydrologis
# HYDROLOGIS water cycle pipelines — QPE, flood, SMAP, GRACE, seasonal
# Node affinity: cpu-ingestion nodes | tolerates: dedicated=cpu-ingestion
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hydrologis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/managed-by: tropi-climate-apps
spec:
  project: tropi-climate
  source:
    repoURL: https://github.com/KOSASIH/tropi-climate-analytics
    targetRevision: main
    path: k8s/hydrologis
  destination:
    server: https://kubernetes.default.svc
    namespace: hydrologis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  revisionHistoryLimit: 5
