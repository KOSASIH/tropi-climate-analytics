# NodePool: cpu-ingestion
# Target: DATA-FLOW, HYDROLOGIS, GEOSPATIAL ETL pods
# Pods must tolerate: dedicated=cpu-ingestion:NoSchedule
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: cpu-ingestion
spec:
  template:
    metadata:
      labels:
        role: ingestion
        workload: cpu-ingestion
        node.kubernetes.io/workload-type: cpu
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: tropi-default
      taints:
        - key: dedicated
          value: cpu-ingestion
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.2xlarge", "m5.4xlarge", "m5a.2xlarge", "m5n.2xlarge", "m4.2xlarge"]
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["ap-southeast-3a", "ap-southeast-3b", "ap-southeast-3c"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "96"
    memory: 384Gi
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h
