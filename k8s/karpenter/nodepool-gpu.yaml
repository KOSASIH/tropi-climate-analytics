# NodePool: gpu-training
# Target: ANALYTICA model training jobs (CNN, transformer)
# Pods must tolerate: dedicated=gpu:NoSchedule AND nvidia.com/gpu=present:NoSchedule
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-training
spec:
  template:
    metadata:
      labels:
        role: ml-training
        workload: gpu-training
        node.kubernetes.io/workload-type: gpu
        k8s.amazonaws.com/accelerator: nvidia-tesla-t4
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: tropi-default
      taints:
        - key: dedicated
          value: gpu
          effect: NoSchedule
        - key: nvidia.com/gpu
          value: present
          effect: NoSchedule
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g4dn.xlarge", "g4dn.2xlarge", "g4dn.4xlarge", "p3.2xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
  limits:
    cpu: "64"
    memory: 256Gi
    nvidia.com/gpu: "8"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    expireAfter: 24h
