# ==============================================================
# Karpenter EC2NodeClass — shared node config for dynamic nodes
# Tag subnets/SGs with karpenter.sh/discovery: tropi-climate-prod
# ==============================================================
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: tropi-default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  amiFamily: AL2
  amiSelectorTerms:
    - alias: al2@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: tropi-climate-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: tropi-climate-prod
  instanceProfile: tropi-climate-prod-eks-node-profile
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        encrypted: true
        deleteOnTermination: true
  tags:
    ManagedBy: karpenter
    Project: tropi-climate-analytics
