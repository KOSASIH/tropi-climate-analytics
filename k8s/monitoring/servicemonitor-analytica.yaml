# ServiceMonitor: analytica-model-server
# Wires Prometheus operator scrape for ANALYTICA FastAPI /metrics endpoint.
#
# Matches deployment-analytica.yaml (SHA 84878099):
#   namespace: analytica
#   selector: app=analytica-model-server
#   port name: metrics (containerPort 8080)
#
# scrapeInterval: 30s (per CLIMATE-OS spec)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: analytica-model-server
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack   # must match prometheusSpec.serviceMonitorSelector
spec:
  jobLabel: analytica-model-server
  selector:
    matchLabels:
      app: analytica-model-server
  namespaceSelector:
    matchNames:
      - analytica
  endpoints:
    - port: metrics          # matches Service port name and deployment containerPort name
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        # Preserve model label from pod labels
        - sourceLabels: [__meta_kubernetes_pod_label_model]
          targetLabel: model
          action: replace
        # Namespace for alert routing
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
          action: replace
        # Pod name for debugging
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
          action: replace
      metricRelabelings:
        # Keep tropi_model_*, http_requests_total, process and gc metrics
        - sourceLabels: [__name__]
          regex: 'tropi_model_.+|http_requests_total|http_request_duration_seconds.*|process_.*|python_gc_.*'
          action: keep
