# ============================================================
# CI/CD Pipeline — Tropi Climate Analytics
# GitHub Actions: test → build → push ghcr.io → deploy (ArgoCD)
# Managed by: CLOUD-FORGE
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [dev, staging, prod]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/kosasih/tropi-climate-analytics
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # JOB 1: Lint & Test
  # ============================================================
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit safety

      - name: Lint (ruff)
        run: ruff check src/ --output-format github

      - name: Security scan (bandit)
        run: bandit -r src/ -ll --format github

      - name: Dependency audit (safety)
        run: safety check -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest src/tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # JOB 2: Build & Push Docker Images
  # ============================================================
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push-api.outputs.digest }}

    strategy:
      matrix:
        service:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: etl-worker
            dockerfile: docker/Dockerfile.etl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.service.name }}
        id: build-push-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Sign container image (cosign)
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}@${{ steps.build-push-api.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: 1

  # ============================================================
  # JOB 3: Deploy to Staging (ArgoCD GitOps)
  # ============================================================
  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.tropi-climate.id
    steps:
      - uses: actions/checkout@v4

      - name: Update k8s image tags (staging)
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|image: .*tropi-climate-analytics/api:.*|image: ${{ env.IMAGE_NAMESPACE }}/api:${SHA_TAG}|g" k8s/api-deployment.yaml
          sed -i "s|image: .*tropi-climate-analytics/etl-worker:.*|image: ${{ env.IMAGE_NAMESPACE }}/etl-worker:${SHA_TAG}|g" k8s/etl-worker-deployment.yaml

      - name: Commit updated manifests
        run: |
          git config user.email "cloud-forge@tropi-climate.id"
          git config user.name "CLOUD-FORGE"
          git add k8s/
          git commit -m "ci: update staging image tags to sha-$(echo ${{ github.sha }} | cut -c1-7) [skip ci]"
          git push

  # ============================================================
  # JOB 4: Deploy to Production (manual approval + ArgoCD)
  # ============================================================
  deploy-production:
    name: 🌏 Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.tropi-climate.id
    steps:
      - uses: actions/checkout@v4

      - name: Update k8s image tags (production)
        run: |
          SHA_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s|image: .*tropi-climate-analytics/api:.*|image: ${{ env.IMAGE_NAMESPACE }}/api:${SHA_TAG}|g" k8s/api-deployment.yaml
          sed -i "s|image: .*tropi-climate-analytics/etl-worker:.*|image: ${{ env.IMAGE_NAMESPACE }}/etl-worker:${SHA_TAG}|g" k8s/etl-worker-deployment.yaml

      - name: Commit updated manifests (ArgoCD auto-sync)
        run: |
          git config user.email "cloud-forge@tropi-climate.id"
          git config user.name "CLOUD-FORGE"
          git add k8s/
          git commit -m "ci: deploy prod sha-$(echo ${{ github.sha }} | cut -c1-7) [skip ci]"
          git push

      - name: Post deployment notification
        if: always()
        run: |
          echo "::notice::Production deployment triggered for commit ${{ github.sha }}"
